<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c3baa"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="book" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e5e5e5"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="url(#bg)"/>
  <!-- Book shape -->
  <g transform="translate(256, 256)">
    <!-- Left page -->
    <path d="M -120 -100 L -120 100 L -10 120 L -10 -80 Z" fill="url(#book)" opacity="0.95"/>
    <!-- Right page -->
    <path d="M 120 -100 L 120 100 L 10 120 L 10 -80 Z" fill="url(#book)" opacity="0.85"/>
    <!-- Center spine -->
    <path d="M -10 -80 L 0 -90 L 10 -80 L 10 120 L 0 130 L -10 120 Z" fill="#4c1d95"/>
    <!-- Page lines left -->
    <line x1="-100" y1="-60" x2="-30" y2="-50" stroke="#8b5cf6" stroke-width="3" opacity="0.4"/>
    <line x1="-100" y1="-30" x2="-30" y2="-20" stroke="#8b5cf6" stroke-width="3" opacity="0.4"/>
    <line x1="-100" y1="0" x2="-30" y2="10" stroke="#8b5cf6" stroke-width="3" opacity="0.4"/>
    <line x1="-100" y1="30" x2="-30" y2="40" stroke="#8b5cf6" stroke-width="3" opacity="0.4"/>
    <line x1="-100" y1="60" x2="-30" y2="70" stroke="#8b5cf6" stroke-width="3" opacity="0.4"/>
    <!-- Page lines right -->
    <line x1="100" y1="-60" x2="30" y2="-50" stroke="#8b5cf6" stroke-width="3" opacity="0.4"/>
    <line x1="100" y1="-30" x2="30" y2="-20" stroke="#8b5cf6" stroke-width="3" opacity="0.4"/>
    <line x1="100" y1="0" x2="30" y2="10" stroke="#8b5cf6" stroke-width="3" opacity="0.4"/>
    <line x1="100" y1="30" x2="30" y2="40" stroke="#8b5cf6" stroke-width="3" opacity="0.4"/>
    <line x1="100" y1="60" x2="30" y2="70" stroke="#8b5cf6" stroke-width="3" opacity="0.4"/>
  </g>
  <!-- Letter M -->
  <text x="256" y="420" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#ffffff" text-anchor="middle" opacity="0.9">M</text>
</svg>
